<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ system_title }}{% endblock %}</title>
    
    <!-- Favicon and Icons -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicons/favicon.ico') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicons/favicon.svg') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicons/favicon-16x16.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicons/favicon-32x32.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/favicons/apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='img/favicons/site.webmanifest') }}">
    <meta name="msapplication-config" content="{{ url_for('static', filename='img/favicons/browserconfig.xml') }}">
    
    <!-- Theme colors for mobile browsers -->
    <meta name="theme-color" content="#C96442">
    <meta name="msapplication-TileColor" content="#C96442">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script>
        (function () {
            try {
                var savedColorTheme = localStorage.getItem('mailSystemColorTheme');
                var supportedColorThemes = ['clay', 'ocean', 'emerald', 'violet', 'rose'];
                document.documentElement.dataset.colorTheme = supportedColorThemes.indexOf(savedColorTheme) >= 0 ? savedColorTheme : 'clay';
            } catch (error) {
                document.documentElement.dataset.colorTheme = 'clay';
            }
        })();
    </script>
    
    {% block head %}{% endblock %}
    <!-- Claude-style theme: loaded last so it overrides per-page inline styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/claude-theme.css') }}">
    <!-- Shared admin interaction/animation layer (additive; loads after theme) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-ui.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/color-theme.css') }}">
    <style>
        :root {
            --scroll-card-offset: 110px; /* reserve ~110px (search toolbar + card padding + pagination buffer) so pagination stays visible */
            --scroll-card-max-height: calc(100vh - var(--header-height, 70px) - var(--scroll-card-offset));
        }
        html,
        body {
            max-width: 100%;
            overflow-x: hidden;
        }
        .is-hidden {
            display: none !important;
        }
        /* Disable transitions on initial load to prevent sidebar flash */
        .preload * {
            transition: none !important;
        }
        .i18n-switcher {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 4500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 36px;
            padding: 8px 10px;
            border: 1px solid rgba(201, 100, 66, 0.18);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.12);
            backdrop-filter: blur(12px);
        }
        .i18n-switcher::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 5px solid #64748b;
            pointer-events: none;
        }
        .i18n-switcher label {
            margin: 0;
            color: #6b7280;
            font-size: 12px;
            font-weight: 700;
            line-height: 1;
        }
        .i18n-switcher select {
            min-width: 96px;
            height: 24px;
            padding: 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: #1f2937;
            font-size: 13px;
            font-weight: 700;
            line-height: 24px;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }
        .i18n-switcher--header {
            position: relative;
            right: auto;
            bottom: auto;
            z-index: auto;
            display: inline-flex;
            align-items: center;
            flex: 0 0 auto;
            height: 40px;
            min-height: 40px;
            min-width: 96px;
            padding: 0 34px 0 14px;
            border-color: #e5e7eb;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
            gap: 0;
            backdrop-filter: none;
        }
        .i18n-switcher--header::after {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            margin-left: 0;
            border-top-color: #475569;
        }
        .i18n-switcher--header label {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        .i18n-switcher--header select {
            width: 100%;
            min-width: 0;
            height: 38px;
            padding: 0;
            border: 0 !important;
            border-radius: 0;
            outline: 0;
            background: transparent !important;
            box-shadow: none !important;
            color: #1f2937;
            font-size: 14px;
            font-weight: 600;
            line-height: 38px;
            text-align: left;
            appearance: none;
            -webkit-appearance: none;
        }
        .i18n-switcher--header:hover {
            border-color: rgba(201, 100, 66, 0.45);
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
        }
        .i18n-switcher--header:focus-within {
            border-color: #c96442;
            box-shadow: 0 0 0 3px rgba(201, 100, 66, 0.12);
        }
        .i18n-switcher.i18n-switcher--icon {
            position: relative;
            width: 42px;
            min-width: 42px;
            height: 42px;
            min-height: 42px;
            padding: 0;
            gap: 0;
            justify-content: center;
            overflow: visible;
            border-radius: 50%;
        }
        .i18n-switcher.i18n-switcher--icon::after {
            display: none;
        }
        .i18n-switcher--icon .i18n-switcher-icon {
            position: static;
            width: 20px;
            height: 20px;
            padding: 0;
            margin: 0;
            overflow: visible;
            clip: auto;
            color: #475569;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .i18n-switcher--icon .i18n-switcher-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        .i18n-switcher--icon select,
        .i18n-switcher--header.i18n-switcher--icon select {
            position: absolute;
            inset: 0;
            width: 100%;
            min-width: 0;
            height: 100%;
            padding: 0;
            opacity: 0;
            cursor: pointer;
        }
        .i18n-switcher.i18n-switcher--icon:hover .i18n-switcher-icon,
        .i18n-switcher.i18n-switcher--icon:focus-within .i18n-switcher-icon {
            color: #c96442;
        }
        .i18n-language-trigger {
            width: 100%;
            height: 100%;
            padding: 0;
            border: 0;
            border-radius: inherit;
            background: transparent;
            color: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .i18n-language-trigger:focus {
            outline: 0;
        }
        .i18n-language-menu[hidden] {
            display: none !important;
        }
        .i18n-language-menu {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            z-index: 5200;
            width: 206px;
            padding: 7px;
            border: 1px solid rgba(86, 78, 65, 0.12);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 18px 46px rgba(52, 45, 36, 0.18), 0 2px 10px rgba(52, 45, 36, 0.06);
            backdrop-filter: blur(20px);
            transform-origin: top right;
            animation: i18nMenuIn 0.16s ease-out;
        }
        .i18n-switcher:not(.i18n-switcher--header) .i18n-language-menu {
            top: auto;
            bottom: calc(100% + 10px);
            transform-origin: bottom right;
        }
        .i18n-language-menu::before {
            content: '';
            position: absolute;
            top: -5px;
            right: 16px;
            width: 9px;
            height: 9px;
            border-top: 1px solid rgba(86, 78, 65, 0.12);
            border-left: 1px solid rgba(86, 78, 65, 0.12);
            background: rgba(255, 255, 255, 0.97);
            transform: rotate(45deg);
        }
        .i18n-switcher:not(.i18n-switcher--header) .i18n-language-menu::before {
            top: auto;
            bottom: -5px;
            transform: rotate(225deg);
        }
        .i18n-language-option {
            position: relative;
            width: 100%;
            min-height: 46px;
            padding: 6px 10px 6px 7px;
            border: 0;
            border-radius: 11px;
            background: transparent;
            color: #3f3b34;
            display: grid;
            grid-template-columns: 34px minmax(0, 1fr) 18px;
            align-items: center;
            gap: 9px;
            font: inherit;
            text-align: left;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease, transform 0.15s ease;
        }
        .i18n-language-option:hover,
        .i18n-language-option:focus-visible {
            outline: 0;
            color: #a9442d;
            background: #fff5ef;
        }
        .i18n-language-option:active {
            transform: scale(0.985);
        }
        .i18n-language-option.is-active {
            color: #a9442d;
            background: rgba(201, 100, 66, 0.11);
            font-weight: 700;
        }
        .i18n-language-mark {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #706a60;
            background: #f3f1ec;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .i18n-language-option.is-active .i18n-language-mark {
            color: #fff;
            background: linear-gradient(145deg, #d67a55, #b94d32);
            box-shadow: 0 5px 12px rgba(185, 77, 50, 0.2);
        }
        .i18n-language-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
        }
        .i18n-language-check {
            width: 17px;
            height: 17px;
            color: #b94d32;
            opacity: 0;
            transform: scale(0.7);
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .i18n-language-check svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
        }
        .i18n-language-option.is-active .i18n-language-check {
            opacity: 1;
            transform: scale(1);
        }
        @keyframes i18nMenuIn {
            from { opacity: 0; transform: translateY(-5px) scale(0.97); }
            to { opacity: 1; transform: none; }
        }
        @media (max-width: 768px) {
            .i18n-switcher {
                right: 12px;
                bottom: 12px;
                padding: 7px 9px;
            }
            .i18n-switcher label {
                display: none;
            }
            .i18n-switcher select {
                min-width: 88px;
            }
            .i18n-switcher--header {
                right: auto;
                bottom: auto;
                min-width: 88px;
                padding: 0 30px 0 12px;
            }
            .i18n-switcher--header select {
                min-width: 0;
                max-width: none;
            }
        }
        @media (max-width: 1024px) {
            .header {
                min-width: 0;
            }
            .header-actions {
                min-width: 0;
                flex-wrap: wrap;
                justify-content: flex-end;
                gap: 8px;
            }
            .i18n-switcher--header {
                height: 38px;
                min-height: 38px;
                min-width: 86px;
            }
            .logout-btn {
                min-height: 38px;
            }
        }
        @media (max-width: 560px) {
            .header {
                height: auto;
                min-height: 64px;
                align-items: flex-start;
                padding-top: 10px !important;
                padding-bottom: 10px !important;
                gap: 8px;
            }
            .header-left {
                min-width: 0;
            }
            .header-title {
                max-width: 44vw;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .header-actions {
                flex: 1 1 auto;
            }
            .header-actions .user-info {
                display: none;
            }
        }
        /* Shared table scroll helpers */
        .scroll-card-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
            max-height: var(--scroll-card-max-height); /* leave room for header + toolbar/padding */
        }
        .scroll-card-body .table-container {
            flex: 1;
            min-height: 0;
            overflow: auto;
        }
        .scroll-card-body .pagination-container {
            position: sticky;
            bottom: 0;
            background: #fff;
            padding: 10px 0 6px;
            margin-top: 8px;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.03);
            z-index: 5;
        }
        {% if embedded %}
        body.embedded-view {
            min-height: 100vh !important;
            padding: 0 !important;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            background: #ffffff !important;
        }
        body.embedded-view .sidebar,
        body.embedded-view .mobile-overlay,
        body.embedded-view .main-content > .header,
        body.embedded-view .i18n-switcher {
            display: none !important;
        }
        body.embedded-view .main-content {
            margin-left: 0 !important;
            min-height: 100vh !important;
            width: 100% !important;
        }
        body.embedded-view .content {
            padding: 16px !important;
        }
        body.embedded-view .card {
            box-shadow: none;
        }
        @media (max-width: 640px) {
            body.embedded-view {
                font-size: 16px !important;
            }
            body.embedded-view .content {
                padding: 8px !important;
                overflow: visible !important;
            }
            body.embedded-view input,
            body.embedded-view select,
            body.embedded-view textarea {
                font-size: 16px !important;
            }
            body.embedded-view .btn {
                min-height: 44px;
                font-size: 15px;
            }
            body.embedded-view .main-content {
                height: auto !important;
                overflow: visible !important;
            }
            body.embedded-view .scroll-card-body {
                height: auto !important;
                max-height: none !important;
                overflow: visible !important;
            }
            body.embedded-view .scroll-card-body .table-container {
                max-height: none !important;
                overflow: visible !important;
            }
            body.embedded-view .scroll-card-body .pagination-container {
                position: static !important;
            }
        }
        {% endif %}
        /* Tablet/mobile admin layout fixes */
        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(-100%);
                width: 260px;
            }
            .sidebar.mobile-open {
                transform: translateX(0);
            }
            .sidebar-toggle {
                display: none !important;
            }
            .mobile-menu-toggle {
                display: inline-flex !important;
            }
            .main-content {
                margin-left: 0 !important;
            }
            body.sidebar-collapsed .sidebar {
                width: 260px;
            }
            body.sidebar-collapsed .nav-item {
                font-size: inherit;
                padding: 14px 20px;
                text-align: left;
            }
            body.sidebar-collapsed .nav-item i {
                margin-right: 8px;
                font-size: inherit;
            }
            body.sidebar-collapsed .sidebar-logo {
                font-size: 18px;
                padding: 18px;
            }
            body.sidebar-collapsed .sidebar-logo::after {
                content: '';
            }
            .content {
                padding: 20px !important;
            }
        }
    </style>
</head>
<body class="preload{% if embedded %} embedded-view{% endif %}">
    {% include '_icons.html' %}
    {% if request.path and '/admin' in request.path %}
    <canvas id="adminBgCanvas" aria-hidden="true"></canvas>
    {% endif %}
    <script>
        (function() {
            try {
                const MOBILE_BREAKPOINT = 1024;
                const saved = localStorage.getItem('adminSidebarCollapsed');
                const collapsed = saved === null ? true : (saved === '1' || saved === 'true'); // accept legacy '1'/'0' and boolean strings
                const shouldCollapse = window.innerWidth > MOBILE_BREAKPOINT && collapsed;
                if (shouldCollapse) {
                    document.body.classList.add('sidebar-collapsed');
                }
            } catch (e) {
                /* ignore */
            }
            // Remove preload class after a short delay to enable transitions
            window.addEventListener('load', function() {
                setTimeout(function() {
                    document.body.classList.remove('preload');
                }, 100);
            });
        })();
    </script>
    {% block body %}{% endblock %}
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script src="{{ url_for('static', filename='js/color-theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin-ui.js') }}"></script>
    <script>if (window.AdminUI) { AdminUI.initCanvas(); }</script>
    {% if request.path and '/admin' in request.path %}
    <script src="{{ url_for('static', filename='js/admin-help.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin-help-ui.js') }}"></script>
    {% endif %}
    {% block scripts %}{% endblock %}
</body>
</html>
